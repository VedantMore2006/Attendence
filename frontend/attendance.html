<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records | SAS - Smart Attendance System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-1"></div>
    </div>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="premium-logo">
                <div class="premium-icon">
                    <i class="fas fa-fingerprint"></i>
                </div>
                <div class="premium-text-box">
                    <span class="premium-title">SAS</span>
                    <span class="premium-dot">.</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="scan.html"><i class="fas fa-camera"></i> Scan Face</a></li>
                <li><a href="register.html"><i class="fas fa-user-plus"></i> Register</a></li>
                <li><a href="attendance.html" class="active"><i class="fas fa-calendar-check"></i> Records</a></li>
                <li><a href="stats.html"><i class="fas fa-chart-line"></i> Stats</a></li>
            </ul>
            <div class="nav-status">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h2><i class="fas fa-clipboard-list"></i> Attendance Log</h2>
            <p>Full check-in history — filtered by date</p>
        </div>

        <div class="card">
            <div class="filter-bar">
                <div class="form-group" style="max-width: 300px;">
                    <label for="date-filter"><i class="fas fa-calendar-alt"></i> Filter by Date</label>
                    <input type="date" id="date-filter">
                </div>
                <div class="filter-stats">
                    <div class="filter-stat">
                        <span class="filter-stat-label">Total Records</span>
                        <span class="filter-stat-value" id="record-count">—</span>
                    </div>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-hashtag"></i> User ID</th>
                            <th><i class="fas fa-user"></i> Name</th>
                            <th><i class="fas fa-calendar-day"></i> Date</th>
                            <th><i class="fas fa-right-to-bracket"></i> Check-in</th>
                            <th><i class="fas fa-right-from-bracket"></i> Check-out</th>
                            <th><i class="fas fa-hourglass-half"></i> Duration</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-body">
                        <tr>
                            <td colspan="6">
                                <div class="spinner"></div> Loading…
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p><i class="fas fa-shield-alt"></i> All data remains local — your privacy is protected</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        window.addEventListener('load', () => {
            App.loadAttendance();

            const dateFilter = document.getElementById('date-filter');
            if (dateFilter) {
                const today = new Date().toISOString().split('T')[0];
                dateFilter.value = today;

                dateFilter.addEventListener('change', async () => {
                    const tbody = document.getElementById('attendance-body');
                    tbody.innerHTML = '<tr><td colspan="4"><div class="spinner"></div> Loading…</td></tr>';
                    const data = await API.getAttendance(dateFilter.value);
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)"><i class="fas fa-inbox"></i> No records for this date</td></tr>';
                        document.getElementById('record-count').innerText = '0';
                        return;
                    }
                    document.getElementById('record-count').innerText = data.length;

                    function calcDuration(inTime, outTime) {
                        if (!outTime) return '<span style="color:var(--warning);font-size:0.75rem"><i class="fas fa-circle-dot"></i> Still inside</span>';
                        const [ih, im, is_] = inTime.split(':').map(Number);
                        const [oh, om, os_] = outTime.split(':').map(Number);
                        const diffSec = (oh * 3600 + om * 60 + os_) - (ih * 3600 + im * 60 + is_);
                        if (diffSec <= 0) return '—';
                        const h = Math.floor(diffSec / 3600);
                        const m = Math.floor((diffSec % 3600) / 60);
                        return h > 0 ? `${h}h ${m}m` : `${m}m`;
                    }

                    tbody.innerHTML = data.map(row => `
                        <tr>
                            <td><span class="user-id-badge">#${row.user_id}</span></td>
                            <td><strong><i class="fas fa-user-circle"></i> ${row.name}</strong></td>
                            <td><i class="fas fa-calendar-alt"></i> ${row.date}</td>
                            <td><span class="time-badge checkin-badge"><i class="fas fa-right-to-bracket"></i> ${row.time}</span></td>
                            <td>${row.checkout_time
                                ? `<span class="time-badge checkout-badge"><i class="fas fa-right-from-bracket"></i> ${row.checkout_time}</span>`
                                : `<span style="color:var(--text-muted);font-size:0.8rem">—</span>`
                            }</td>
                            <td>${calcDuration(row.time, row.checkout_time)}</td>
                        </tr>
                    `).join('');
                });

                dateFilter.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>

</html>
