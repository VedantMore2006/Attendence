<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Attendance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">SmartScan AI</a>
            <ul class="nav-links">
                <li><a href="scan.html">Scan Face</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="attendance.html">Records</a></li>
                <li><a href="stats.html">Stats</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="card">
            <h2>User Registration</h2>
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="Enter name..." required>
            </div>

            <div class="video-wrapper small">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <div class="registration-controls">
                <button id="capture-btn" class="btn btn-secondary">Capture Image (0/3)</button>
                <button id="submit-reg" class="btn btn-primary" disabled>Register User</button>
            </div>

            <div id="reg-status" class="status-box hidden"></div>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        window.addEventListener('load', () => {
            App.initRegisterPage();
        });
    </script>
</body>
</html>
