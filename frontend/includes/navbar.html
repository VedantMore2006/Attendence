<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Component</title>
    <style>
        /* Navbar Styles */
        .navbar {
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
            transition: all 0.2s;
        }

        .navbar-brand:hover {
            color: #60a5fa;
            transform: translateX(2px);
        }

        .navbar-brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .navbar-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
        }

        .navbar-item a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }

        .navbar-item a:hover,
        .navbar-item a.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .navbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .navbar-btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .navbar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
        }

        .navbar-toggle {
            display: none;
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .navbar-container {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .navbar-brand {
                font-size: 1.1rem;
            }

            .navbar-toggle {
                display: block;
                order: 3;
            }

            .navbar-menu {
                display: none;
                order: 4;
                flex-direction: column;
                width: 100%;
                gap: 0.5rem;
                background: rgba(0, 0, 0, 0.3);
                padding: 1rem;
                border-radius: 8px;
                margin-top: 1rem;
            }

            .navbar-menu.active {
                display: flex;
            }

            .navbar-item a {
                display: block;
                padding: 0.75rem;
            }

            .navbar-actions {
                order: 5;
                width: 100%;
                flex-direction: column;
            }

            .navbar-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                <div class="navbar-brand-icon">📊</div>
                <span>Smart Attendance</span>
            </a>

            <button class="navbar-toggle" id="navbarToggle">
                <span>☰</span>
            </button>

            <ul class="navbar-menu" id="navbarMenu">
                <li class="navbar-item">
                    <a href="../index.html" class="nav-link">Home</a>
                </li>
                <li class="navbar-item">
                    <a href="../wizard/wizard.html" class="nav-link">Setup</a>
                </li>
                <li class="navbar-item">
                    <a href="../register/register.html" class="nav-link">Register</a>
                </li>
                <li class="navbar-item">
                    <a href="../scan/scan.html" class="nav-link">Scan</a>
                </li>
                <li class="navbar-item">
                    <a href="../dashboard/dashboard.html" class="nav-link">Dashboard</a>
                </li>
            </ul>

            <div class="navbar-actions">
                <button class="navbar-btn" onclick="goToWizard()">Quick Start</button>
            </div>
        </div>
    </nav>

    <script>
        // Navbar toggle for mobile
        document.getElementById('navbarToggle').addEventListener('click', () => {
            const menu = document.getElementById('navbarMenu');
            menu.classList.toggle('active');
        });

        // Close menu when item is clicked
        document.querySelectorAll('.navbar-item a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navbarMenu').classList.remove('active');
            });
        });

        // Set active link based on current page
        function setActiveNavLink() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                const href = link.getAttribute('href').split('/').pop();
                if (href === currentPage || (currentPage === '' && href === 'index.html')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        function goToWizard() {
            window.location.href = '../wizard/wizard.html';
        }

        // Set active link on page load
        window.addEventListener('load', setActiveNavLink);
        window.addEventListener('hashchange', setActiveNavLink);
    </script>
</body>
</html>
